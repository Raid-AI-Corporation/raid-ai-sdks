openapi: 3.1.0
info:
  title: Raid AI API
  version: '2025-06-01'
  summary: Detect AI-generated and manipulated media, and fact-check claims.
  description: "The **Raid AI API** analyzes media for AI generation, deepfakes, and manipulation\nacross **images, audio, and video**, analyzes **documents** for tampering and AI generation,\nand **fact-checks** media against the public record.\n\nAll requests are authenticated with a **bearer token** — see **Authentication**. Endpoints\nare grouped by modality, plus *Fact-Checking* and a *System Management* health check.\n\n**Synchronous vs. asynchronous**\n- **Image** and **Audio** endpoints are *synchronous* — the response contains the result.\n- **Document** endpoints are *asynchronous* — one upload starts an analysis that runs for\n  minutes; the upload response carries the record, and you poll it until the verdict lands.\n- **Video** and **Fact-Checking** endpoints are *asynchronous* — you submit a job, receive an\n  id, then poll until it is complete.\n"
  contact:
    name: Raid AI Support
    email: info@raidxai.com
    url: https://raidxai.com
  license:
    name: Raid AI Terms of Service
    url: https://raidxai.com
security:
- BearerAuth: []
tags:
- name: Image
  description: Detect AI-generated, deepfaked, and digitally edited images.
- name: Audio
  description: Detect AI-generated and cloned voices, with optional transcription and analysis.
- name: Video
  description: Detect deepfake and AI-generated video. Asynchronous — submit then poll.
- name: Document
  description: Analyze documents for tampering and AI generation. One upload returns a document-level forensics verdict plus per-page results. Asynchronous — upload then poll.
- name: Fact-Checking
  description: Check images, audio, and video against the public record. Asynchronous.
- name: System Management
  description: Service health and liveness.
paths:
  /api/app/image-forensics/process:
    post:
      tags:
      - Image
      operationId: imageForensicsProcess
      summary: Analyze image files
      description: Upload one or more images and receive a verdict, confidence, and (on detailed plans) generator attribution and a deep-analysis breakdown for each image. Up to 10 images per request, max 50 MB each; formats jpg, jpeg, png, webp, heic, heif, tiff.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageFiles:
                  type: array
                  description: One or more image files to analyze.
                  items:
                    type: string
                    format: binary
                input.ExternalId:
                  type: string
                  description: Optional caller-provided ID to correlate this analysis with your own systems.
                sourceUrl:
                  type: string
                  description: Optional source URL of the image, recorded for your own auditing.
                processingMode:
                  type: string
                  enum:
                  - REALTIME
                  - BATCH
                  default: REALTIME
                  description: '`REALTIME` (default) analyzes immediately and returns verdicts in the response. `BATCH` queues the images for a later scheduled window at a reduced credit cost and returns a batch ID instead of results — see the Batch mode guide. Unrecognized values are treated as `REALTIME`.'
              required:
              - imageFiles
      responses:
        '200':
          description: Analysis complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageForensicsResponse'
              example:
                images:
                - id: f1d2e3c4-5678-90ab-cdef-1234567890ab
                  fileName: suspect.jpg
                  verdict: ai_generated
                  confidence: 0.972
                  isManipulated: true
                  creditsUsed: 1
                  processingTimeMs: 1840
                  errorMessage: null
                  createdAt: '2026-06-07T12:34:56Z'
                  deepfakeScore: 0.12
                  generators:
                    midjourney: 0.95
                    flux: 0.03
                  deepAnalysis:
                    agreement: strong
                    keyIndicators:
                    - Uniform texture across skin regions
                    - Lighting direction is inconsistent with shadows
                    detailedReasoning: The image shows rendering characteristics typical of AI generation, including uniform micro texture and inconsistent lighting.
                    visualPatterns:
                    - Overly smooth gradients in the background
                    recommendations:
                    - Request the original file from the source
                    metadataFindings:
                    - kind: editingSoftware
                      value: Adobe Photoshop 24.0
                      significance: warning
                    - kind: createdDate
                      value: 2026:06:01 10:00:00
                      significance: info
                    - kind: gpsPresent
                      significance: notable
                totalCreditsUsed: 1
                totalProcessingTimeMs: 1840
                isSuccessful: true
                errorMessage: null
                hasDetailedReport: true
        '202':
          description: Returned when `processingMode=BATCH`. The images are queued; credits are deducted now and results are retrievable once the batch completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageBatchSubmitResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/image-forensics/batches:
    post:
      tags:
      - Image
      operationId: imageBatchSubmit
      summary: Queue images for batch analysis
      description: 'Queue images for analysis during the next scheduled window, at a reduced credit cost. Returns immediately with a batch ID and no verdicts, so reach for it when results are not needed straight away: dataset cleaning, bulk verification, historical backfills. Turnaround is up to one full processing window — for immediate verdicts use the process endpoint instead. Credits are deducted when the batch is accepted and refunded for any image that ultimately fails.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageFiles:
                  type: array
                  description: Images to queue.
                  items:
                    type: string
                    format: binary
                input.ExternalId:
                  type: string
                  description: Optional caller-provided ID to correlate this batch with your own systems.
              required:
              - imageFiles
      responses:
        '202':
          description: Batch accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageBatchSubmitResponse'
              example:
                batchId: 8f14e45f-ceea-467a-9f38-1a2b3c4d5e6f
                status: Accepted
                itemCount: 40
                creditsCharged: 640
                creditsPerItem: 16
                realtimeCreditsPerItem: 20
                estimatedProcessingWindow: next scheduled window
                statusUrl: /api/app/image-forensics/batches/8f14e45f-ceea-467a-9f38-1a2b3c4d5e6f
                externalId: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Image
      operationId: imageBatchList
      summary: List your batches
      parameters:
      - name: skip
        in: query
        schema:
          type: integer
          default: 0
      - name: take
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: A page of batches, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageBatchPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/image-forensics/batches/{batchId}:
    get:
      tags:
      - Image
      operationId: imageBatchGet
      summary: Get batch status
      description: Poll this until isTerminal is true, then fetch the results. There is no webhook.
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current batch status and counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/app/image-forensics/batches/{batchId}/results:
    get:
      tags:
      - Image
      operationId: imageBatchResults
      summary: Get batch results
      description: Per-image verdicts. Available as soon as individual images finish — you do not have to wait for the whole batch. Batch results carry verdict, confidence and deepfake score; deep analysis, generator attribution and heatmaps are realtime-only.
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: skip
        in: query
        schema:
          type: integer
          default: 0
      - name: take
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: A page of per-image results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageBatchResultPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/app/image-forensics/batches/{batchId}/cancel:
    post:
      tags:
      - Image
      operationId: imageBatchCancel
      summary: Cancel a batch
      description: Cancels images still waiting and refunds their credits. Images already being analyzed are left to finish, so the refund covers only what was actually cancelled.
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cancellation applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageBatchCancelResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/app/image-forensics/process-from-url:
    post:
      tags:
      - Image
      operationId: imageForensicsProcessFromUrl
      summary: Analyze an image from a URL
      description: Analyze an image fetched from a public URL — a direct image link, or a social or media page, in which case the image is extracted automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS URL of the image or the page that contains it.
                  examples:
                  - https://example.com/photo.jpg
                externalId:
                  type: string
                  description: Optional caller-provided ID.
              required:
              - url
      responses:
        '200':
          description: Analysis complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageForensicsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/image-forensics/credit-info:
    get:
      tags:
      - Image
      operationId: imageForensicsCreditInfo
      summary: Get image credits and limits
      description: 'Read the credit balance and the current image limits: cost per image, max file size and allowed formats, plus whether the batch tier is available and what it costs. Read these rather than hard-coding the defaults — they are account settings and can change. Any valid API key may call this; no scope is required.'
      responses:
        '200':
          description: Balance and limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageForensicsCreditInfo'
              example:
                currentBalance: 480
                creditCostPerImage: 1
                canUseFeature: true
                maxFileSizeMB: 50
                allowedFileFormats: jpg,jpeg,png,webp,heic,heif,tiff
                canUseBatch: true
                batchCreditCostPerImage: 1
                batchMaxSize: 100
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/voice-analysis/process:
    post:
      tags:
      - Audio
      operationId: voiceAnalysisProcess
      summary: Analyze an audio file
      description: Analyze an audio file. By default (input.WorkflowType 4) this detects whether a voice is AI- generated or cloned; other workflows transcribe speech, run intelligence analysis, or combine both. Max 50 MB per file; formats wav, mp3, flac, m4a, opus.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audioFile:
                  type: string
                  format: binary
                  description: The audio file to analyze.
                input.WorkflowType:
                  $ref: '#/components/schemas/VoiceWorkflowType'
                input.TextInput:
                  type: string
                  description: Text to analyze for the Intelligence or Combined workflows (max 50,000 chars).
                input.ContextHints:
                  type: string
                  description: Optional context to guide analysis (max 500 chars).
                sourceUrl:
                  type: string
                  description: Optional source URL of the audio, recorded for your own auditing.
              required:
              - audioFile
      responses:
        '200':
          description: Analysis complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceAnalysisResponse'
              example:
                isSuccessful: true
                errorMessage: null
                workflowType: AiDetectionOnly
                transcript: null
                analysis: null
                contextUsed: null
                isAiDetected: true
                detectionConfidence: 0.93
                detectionClassification: fake
                processingTimeMs: 2110
                creditsUsed: 1
                metadata:
                  provider: raid_1b
                  detection_method: raid_1b_llr_global_mean
                  calibration_version: allaug_ep2_qmf_2026-09-01
                  score: 0.994
                  score_basis: percentile_vs_genuine
                  p_fake: 0.31
                  probability_calibrated: false
                  threshold_calibrated: true
                  threshold_global_tau: -4.93
                  global_llr_mean: -7.6
                  threshold_fired_global: true
                  overall_result: fake
                  total_chunks: 2
                  real_chunks: 0
                  fake_chunks: 2
                  low_confidence: false
                  truncated: false
                  audio_total_s: 6.2
                  audio_analyzed_s: 6.2
                  chunks:
                  - index: 0
                    chunk: 0-4s
                    result: fake
                    confidence: 0.91
                    score: 0.29
                    start_s: 0
                    end_s: 4
