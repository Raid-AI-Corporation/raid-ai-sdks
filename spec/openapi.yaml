        '202':
          description: '**The expected outcome.** The analysis is still running server-side; the body is the same record with whatever pages have finished so far — a `202` always carries the partial record, never an empty "come back later". Poll `GET /api/app/document-analysis/{id}` (the `Location` header carries the exact URL) until `status` is `completed` or `failed`. Clients behind a proxy that cuts long-held responses may see the connection drop before this lands — retrying the upload would charge a second credit, so fetch the record instead.'
          headers:
            Location:
              description: URL of the record — `GET /api/app/document-analysis/{id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAnalysis'
              example:
                id: 9d1f6a2c-8b4e-4f21-9a77-0c2b5e6d3a10
                docId: t-3f9c1a2b4d5e6f708192a3b4c5d6e7f8-u1a2b3c4d5e6f7a8b9c0d1e
                fileName: invoice-april.pdf
                mediaKind: pdf
                docType: ''
                status: processing
                forensicsStatus: processing
                pagesStatus: processing
                fusedVerdict: ''
                fusedProbability: 0
                fusionRationale: ''
                stageErrorsJson: null
                pagesTotal: 2
                pagesCompleted: 1
                pagesFailed: 0
                creditsUsed: 1
                refundReason: null
                completedAt: null
                docTypeConfidence: 0
                processingTimeMs: 0
                processedAt: null
                hasOriginal: true
                verdict: null
                pages:
                - pageNumber: 1
                  verdict: authentic
                  localizedEditing: false
                  editingScore: 0.08
                  aiStatus: completed
                  aiVerdict: real
                  aiConfidence: 0.96
                  errorCode: null
                  completedAt: '2026-07-29T10:14:40Z'
                  editedRegions: []
                  pageWidth: 1600
                  pageHeight: 2263
                  meanConfidence: 0.82
                  threshold: 0.5
                  hasImage: true
        '400':
          $ref: '#/components/responses/DocumentValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/CreditLimitReached'
        '403':
          $ref: '#/components/responses/DocumentForbidden'
  /api/app/document-analysis/{id}:
    get:
      tags:
      - Document
      operationId: documentAnalysisGet
      summary: Get a document analysis
      description: 'Fetch one analysis by id. This is the poll target after analyze returns 202: the pages array grows and the forensics verdict fills in across successive calls, with the body shape identical at every stage. Stop when status is completed or failed; polling every few seconds is enough for a job that runs in minutes.'
      parameters:
      - name: id
        in: path
        required: true
        description: The analysis `id` returned by `analyze`.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The analysis, partial or terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAnalysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/app/document-analysis/{id}/pages/{pageNumber}/image:
    get:
      tags:
      - Document
      operationId: documentAnalysisGetPageImage
      summary: Get a page image
      description: Stream the rendered page raster as a PNG. This is the exact image a page's region coordinates are measured against, so tampered-region boxes can be drawn straight onto it. Available while the page reports hasImage true; anything else returns 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pageNumber
        in: path
        required: true
        description: 1-based page number.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: The page raster.
          headers:
            Cache-Control:
              description: '`private, max-age=300`'
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/app/document-analysis/{id}/evidence:
    get:
      tags:
      - Document
      operationId: documentAnalysisGetEvidence
      summary: Get an evidence crop
      description: Stream one forensics evidence raster for a feature lane and page. Storage URIs are never fetchable directly and are never accepted as input — the URI is resolved server-side from this analysis's own verdict, so a crop is addressed by lane, page and optionally a recovered- redaction name. Any miss returns 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: feature
        in: query
        required: true
        description: Which feature lane's evidence to read.
        schema:
          type: string
          enum:
          - tampering
          - consistency
          - anomaly
      - name: page
        in: query
        required: false
        description: 1-based page number.
        schema:
          type: integer
          default: 0
      - name: redaction
        in: query
        required: false
        description: Name of a recovered-redaction crop instead of the page raster — the `redaction-p{page}-….png` file name as it appears in the lane's `evidenceUris`.
        schema:
          type: string
      responses:
        '200':
          description: The evidence raster.
          headers:
            Cache-Control:
              description: '`private, max-age=300`'
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/app/document-analysis/credit-info:
    get:
      tags:
      - Document
      operationId: documentAnalysisCreditInfo
      summary: Get credit balance and upload limits
      description: 'Read the credit balance, the per-document cost and the current upload constraints: size ceilings, the batch limit and the recommended request concurrency. Read these rather than hard- coding the defaults — they are account settings and can change without an SDK or client release.'
      responses:
        '200':
          description: Balance and constraints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAnalysisCreditInfo'
              example:
                currentBalance: 480
                creditCostPerDocument: 1
                maxBatchFiles: 5
                analyzeConcurrency: 3
                maxFileSizeMB: 25
                maxImageSizeMB: 10
                userHeadroomRemaining: null
                canUseFeature: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/fact-checking/submit:
    post:
      tags:
      - Fact-Checking
      operationId: factCheckingSubmit
      summary: Submit media for fact-checking
      description: Submit an image, audio, or video for fact-checking against the public record. Returns a jobId; poll the job until its status is Completed. Max 50 MB per file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The media file to fact-check.
                modality:
                  $ref: '#/components/schemas/Modality'
                userContext:
                  type: string
                  description: Optional context (e.g. claimed source or background); echoed back in the result.
              required:
              - file
              - modality
      responses:
        '200':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
              example:
                jobId: 7c6d5e4f-aaaa-bbbb-cccc-ddddeeeeffff
                status: Queued
                creditsReserved: 24
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/fact-checking/submit-from-url:
    post:
      tags:
      - Fact-Checking
      operationId: factCheckingSubmitFromUrl
      summary: Submit media for fact-checking from a URL
      description: Fact-check media fetched from a public URL — an article, a social post, or a direct media link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS URL of the media or the page containing it.
                modality:
                  $ref: '#/components/schemas/Modality'
                userContext:
                  type: string
              required:
              - url
              - modality
      responses:
        '200':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/fact-checking/jobs/{id}:
    get:
      tags:
      - Fact-Checking
      operationId: factCheckingGetJob
      summary: Get a fact-checking job
      description: Poll the status and, once complete, the result of a submitted fact-checking job.
      parameters:
      - name: id
        in: path
        required: true
        description: The `jobId` returned by submit.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The current job state. `result` is populated only when `status` is `Completed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactCheckJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/app/fact-checking/credit-info:
    get:
      tags:
      - Fact-Checking
      operationId: factCheckingCreditInfo
      summary: Get fact-checking credits and limits
      description: 'Read the credit balance and the current fact-checking limits: the cost per modality, the per-job credit cap, max file size and allowed formats. Any valid API key may call this; no scope is required.'
      responses:
        '200':
          description: Balance and limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactCheckingCreditInfo'
              example:
                currentBalance: 480
                creditCostPerImage: 5
                creditCostPerAudioMinute: 3
                creditCostPerVideoMinute: 8
                maxCreditsPerJob: 60
                maxFileSizeMB: 50
                allowedFileFormats: jpg,jpeg,png,webp,mp3,wav,m4a,mp4,mov,webm
                canUseFeature: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /health:
    get:
      tags:
      - System Management
      operationId: healthCheck
      summary: Health check
      description: Liveness and readiness probe. Returns plain text and requires no authentication.
      security: []
      responses:
        '200':
          description: The service is healthy.
          content:
            text/plain:
              schema:
                type: string
              example: Healthy
        '503':
          description: The service is unhealthy.
          content:
            text/plain:
              schema:
                type: string
              example: Unhealthy
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Send your secret API token as a bearer token in the `Authorization` header:

        `Authorization: Bearer <token>`. Keep it server-side and never expose it in client code.

        '
  responses:
    ValidationError:
      description: The request was malformed or a file failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            fileTooLarge:
              summary: File too large
              value:
                error:
                  code: IMAGE_FORENSICS:FILE_TOO_LARGE
                  message: File photo.jpg exceeds the maximum size of 50 MB.
            unsupportedFormat:
              summary: Unsupported format
              value:
                error:
                  code: IMAGE_FORENSICS:UNSUPPORTED_FORMAT
                  message: Unsupported file format. Allowed — jpg, jpeg, png, webp, heic, heif, tiff.
    Unauthorized:
      description: The bearer token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Invalid or missing API token.
    NotFound:
      description: The requested resource (e.g. job) was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: Job not found.
    DocumentValidationError:
      description: The upload was rejected before any work ran — no credit is charged. Note the body is a single `error` string, not the `{ code, message }` envelope the other modalities use.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentError'
          examples:
            unsupportedFormat:
              summary: Unsupported format
              value:
                error: Unsupported file. Upload a PDF, PNG, JPEG or WebP.
            fileTooLarge:
              summary: File too large
              value:
                error: File exceeds the max size of 25 MB
            tooManyPages:
              summary: Page cap exceeded
              value:
                error: Document has 34 pages; the maximum allowed is 20
            insufficientCredits:
              summary: Not enough credits
              value:
                error: Insufficient credits. This analysis costs 1 credit(s).
    CreditLimitReached:
      description: The calling user has reached their own credit cap (the account may still have credits). API tokens carry no per-user cap and never receive this — for a token, an exhausted balance is a `400` instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaywallError'
          examples:
            userCreditLimit:
              value:
                code: USER_CREDIT_LIMIT_REACHED
                feature: document-analysis
                redirectUrl: null
                message: You have reached your credit limit. Ask an account administrator to raise it.
    DocumentForbidden:
      description: Either the API token is not granted the scope this endpoint requires, or document analysis is not enabled for the account. When it is not enabled, submit is refused here and the read endpoints return `404` — the feature is hidden, not paywalled.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/DocumentError'
          examples:
            scopeMissing:
              summary: Token missing the scope
              value:
                error:
                  code: api_key.scope_missing
                  message: This API key is not authorized for the 'document-image' scope.
            featureDisabled:
              summary: Feature not enabled for the account
              value:
                error: Document Analysis is not enabled for this tenant
  schemas:
    Error:
      type: object
      description: Standard error envelope returned by every endpoint on failure.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              examples:
              - IMAGE_FORENSICS:FILE_TOO_LARGE
            message:
              type: string
              description: Human-readable explanation, safe to log.
            sourceHost:
              type:
              - string
              - 'null'
              description: For URL-based endpoints, the host that could not be resolved.
            userMessage:
              type:
              - string
              - 'null'
              description: A display-friendly variant of the message (URL-based endpoints only).
          required:
          - code
          - message
      required:
      - error
    Verdict:
      type: string
      description: 'Overall classification of the media.

        - `real` — no manipulation detected

        - `ai_generated` — produced by a generative model

        - `ai_edited` — a real asset modified with AI tools

        - `digitally_edited` — conventional (non-AI) editing

        - `unknown` — the analysis was inconclusive

        '
      enum:
      - real
      - ai_generated
      - ai_edited
      - digitally_edited
      - unknown
    JobStatus:
      type: string
      description: Lifecycle state of an asynchronous job.
      enum:
      - Queued
      - Processing
      - Completed
      - Failed
      - Cancelled
    Modality:
      type: string
      description: The kind of media being submitted.
      enum:
      - image
      - audio
      - video
    VoiceWorkflowType:
      type: integer
      description: 'Which voice workflow to run:

        - `1` — Transcription only

        - `2` — Intelligence (text analysis) only

        - `3` — Combined transcription + intelligence

        - `4` — AI-voice detection only (default)

        '
      enum:
      - 1
      - 2
      - 3
      - 4
      default: 4
    Generators:
      type:
      - object
      - 'null'
      additionalProperties:
        type: number
        format: float
      description: 'Generator attribution as a map of generator name → score (0–1), e.g.

        `{ "midjourney": 0.95 }`. Keys are returned dynamically by the detector.

        Null on basic plans.

        '
    MetadataFinding:
      type: object
      description: One user-facing metadata finding derived from the image's embedded metadata.
      properties:
        kind:
          type: string
          description: 'Stable machine key for the finding. Current kinds: `editingSoftware`,

            `cameraInfo`, `createdDate`, `modifiedDate`, `gpsPresent` (presence only —

            coordinates are never returned), and `noMetadata` (the image carries no

            metadata, common for AI generated or re-saved images). New kinds may be

            added over time.

            '
        value:
          type:
          - string
          - 'null'
          description: Optional display value, e.g. `Adobe Photoshop 24.0` or `Canon EOS R5`.
        significance:
          type: string
          enum:
          - info
          - notable
          - warning
          description: How strongly this finding should weigh in a manipulation assessment.
      required:
      - kind
      - significance
    ImageBatchSubmitResponse:
      type: object
      description: Acknowledgement that images were queued. Contains no verdicts.
      properties:
        batchId:
          type: string
          format: uuid
          description: Use this to poll status and fetch results.
        status:
          $ref: '#/components/schemas/ImageBatchStatus'
        itemCount:
          type: integer
          description: Number of images queued.
        creditsCharged:
          type: integer
          description: Total deducted now. Batch charges on acceptance, not on completion.
        creditsPerItem:
          type: integer
          description: Rate applied to this batch, after any plan-specific pricing.
        realtimeCreditsPerItem:
          type: integer
          description: The realtime rate, for comparison.
        estimatedProcessingWindow:
          type:
          - string
          - 'null'
          description: Human-readable hint about when the batch will be processed.
        statusUrl:
          type: string
          description: Relative path to poll for status.
        externalId:
          type:
          - string
          - 'null'
    ImageBatchStatus:
      type: string
      enum:
      - Accepted
      - Processing
      - Completed
      - CompletedWithErrors
      - Cancelled
      - Failed
      description: Batch-level state. `CompletedWithErrors` means the batch finished but at least one image failed — those images were refunded. The last four are terminal.
    ImageBatchItemStatus:
      type: string
      enum:
      - Queued
      - Processing
      - Completed
      - Failed
      - Cancelled
      description: Per-image state within a batch.
    ImageBatch:
      type: object
      properties:
        batchId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImageBatchStatus'
        itemCount:
          type: integer
        completedCount:
          type: integer
        failedCount:
          type: integer
        cancelledCount:
          type: integer
        queuedCount:
          type: integer
        processingCount:
          type: integer
        progressPercent:
          type: integer
          description: 0–100, derived from the per-image counts.
        creditsCharged:
          type: integer
        creditsPerItem:
          type: integer
        creditsRefunded:
          type: integer
          description: Credits returned for images that failed or were cancelled.
        externalId:
          type:
          - string
          - 'null'
        acceptedAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        isTerminal:
          type: boolean
          description: True once the batch will not change again. Stop polling.
    ImageBatchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImageBatch'
        skip:
          type: integer
        take:
          type: integer
        totalCount:
          type: integer
    ImageBatchResult:
      type: object
      properties:
        itemId:
          type: string
          format: uuid
        ordinal:
          type: integer
          description: Position in the original submission, so results can be matched to inputs.
        fileName:
          type: string
        status:
          $ref: '#/components/schemas/ImageBatchItemStatus'
        errorCode:
          type:
          - string
          - 'null'
          description: Set when the image could not be analyzed. Its credits were refunded.
        result:
          oneOf:
          - $ref: '#/components/schemas/ImageResult'
          - type: 'null'
          description: The verdict, once analyzed. Deep analysis, generator attribution and heatmap are always null on this path — those are realtime-only.
    ImageBatchResultPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImageBatchResult'
        skip:
          type: integer
        take:
          type: integer
        totalCount:
          type: integer
    ImageBatchCancelResult:
      type: object
      properties:
        cancelledItems:
          type: integer
          description: Images that were still waiting and have now been cancelled.
        creditsRefunded:
          type: integer
          description: Credits returned for those images only.
    ImageDeepAnalysis:
      type:
      - object
      - 'null'
      description: 'Detailed analysis narrative and findings. Null on basic plans and when the

        detection ran without deep analysis.

        '
      properties:
        agreement:
          type:
          - string
          - 'null'
          description: How strongly the detection signals agree with each other.
        confidence:
          type:
          - string
          - 'null'
          description: Narrative confidence statement for the deep analysis.
        keyIndicators:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The strongest signals behind the verdict.
        detailedReasoning:
          type:
          - string
          - 'null'
          description: Full analysis narrative.
        visualPatterns:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Visual artifacts and patterns observed in the image.
        recommendations:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Suggested next steps for verifying the image.
        metadataFindings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MetadataFinding'
          description: Curated findings from the image's embedded metadata.
    ImageResult:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: Stable record ID for this image (null if the image failed to process).
        fileName:
          type: string
          description: Original file name (or a derived name for URL inputs).
        verdict:
          $ref: '#/components/schemas/Verdict'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence in the verdict, from 0 to 1.
          examples:
          - 0.972
        isManipulated:
          type: boolean
          description: Convenience flag — true when `verdict` is anything other than `real`.
        creditsUsed:
          type: integer
          description: Credits charged for this image.
        processingTimeMs:
          type: integer
          format: int64
          description: Server-side processing time in milliseconds.
        errorMessage:
          type:
          - string
          - 'null'
          description: Failure reason when this image could not be analyzed; otherwise null.
        createdAt:
          type: string
          format: date-time
        deepfakeScore:
          type:
          - number
          - 'null'
          format: float
          description: Likelihood the image is a deepfake (0–1). Null on basic plans.
        generators:
          $ref: '#/components/schemas/Generators'
        deepAnalysis:
          $ref: '#/components/schemas/ImageDeepAnalysis'
        faceAnalysis:
          anyOf:
          - $ref: '#/components/schemas/ImageFaceAnalysis'
          - type: 'null'
          description: 'Face level analysis of the detection. Present only when face details are enabled

            on your account — contact us to enable it. Null otherwise, and null on images

            where the analysis did not run face by face.

            '
      required:
      - fileName
      - verdict
      - confidence
      - isManipulated
      - creditsUsed
      - processingTimeMs
      - createdAt
    ImageFaceAnalysis:
      type: object
      description: 'How the verdict was reached at face level. When `stage` is `face_crop`, every

        detected face was scored individually and `faces` lists them (largest first) with

        `decidingFace` pointing at the face that determined the verdict. When the verdict

        was decided on the whole image (`full_image`, or `full_image_no_face` when no face

        was detected), `decidingFace` and `faces` are null by design.

        '
      properties:
        stage:
          type: string
          enum:
          - full_image
          - face_crop
          - full_image_no_face
          - raw
          description: Which analysis stage decided the verdict.
        fullImageScore:
          type:
          - number
          - 'null'
          format: float
          minimum: 0
          maximum: 1
          description: Whole image synthetic score from the first analysis stage.
        decidingFace:
          anyOf:
          - $ref: '#/components/schemas/ImageFace'
          - type: 'null'
          description: The face that determined the verdict; null when the whole image decided.
        faces:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImageFace'
          description: Every detected face, largest first; null when the whole image decided.
      required:
      - stage
    ImageFace:
      type: object
      description: One detected face, located in original image pixels.
      properties:
        x:
          type: number
          description: Left edge of the face rectangle, in pixels.
        y:
          type: number
          description: Top edge of the face rectangle, in pixels.
        width:
          type: number
        height:
          type: number
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence that this region is a face.
        deepfakeScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Likelihood this face is synthetic, from 0 to 1.
      required:
      - x
      - y
      - width
      - height
      - confidence
      - deepfakeScore
    ImageForensicsResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageResult'
        totalCreditsUsed:
          type: integer
        totalProcessingTimeMs:
          type: integer
          format: int64
        isSuccessful:
          type: boolean
          description: True when at least one image was analyzed successfully.
        errorMessage:
          type:
          - string
          - 'null'
        hasDetailedReport:
          type: boolean
          description: 'True when the response includes detailed fields (`generators`, `deepfakeScore`,

            `deepAnalysis`). False on basic plans, where those fields are null.

            '
      required:
      - images
      - totalCreditsUsed
      - totalProcessingTimeMs
      - isSuccessful
      - hasDetailedReport
    VoiceAnalysisResponse:
      type: object
      properties:
        isSuccessful:
          type: boolean
        errorMessage:
          type:
          - string
          - 'null'
        workflowType:
          type: string
          description: 'Name of the workflow that ran: `TranscriptionOnly`, `IntelligenceOnly`, `Combined` or `AiDetectionOnly`. Requests select the workflow with the numeric `VoiceWorkflowType`; the response echoes its name.'
        transcript:
          type:
          - string
          - 'null'
          description: Transcribed text. Populated for Transcription and Combined workflows.
        analysis:
          type:
          - string
          - 'null'
          description: Intelligence analysis text. Populated for Intelligence and Combined workflows.
        contextUsed:
          type:
          - string
          - 'null'
          description: The context hints that were applied, if any.
        isAiDetected:
          type:
          - boolean
          - 'null'
          description: Whether the voice is AI-generated. Populated for the AI-detection workflow.
        detectionConfidence:
          type:
          - number
          - 'null'
          format: float
          minimum: 0
          maximum: 1
          description: 'How confident the detector is in the verdict it reported in `detectionClassification`, from 0 to 1. It measures how far past the decision boundary the audio landed — **not** the probability that the audio is AI-generated. Read `0.5` as "landed on the boundary, maximally uncertain", not as "50% likely fake", and never derive the opposite verdict''s confidence as `1 - detectionConfidence`: both verdicts are reported at high confidence when they are far from the boundary. Use it to rank and to shade results; it is not a calibrated probability, so don''t present it to end users as a percentage likelihood.'
        detectionClassification:
          type:
          - string
          - 'null'
          description: Classification label for detection, e.g. `real`, `suspicious`, or `fake`.
        processingTimeMs:
          type: integer
          format: int64
        creditsUsed:
          type: integer
        metadata:
          oneOf:
          - $ref: '#/components/schemas/VoiceDetectionDetails'
          - type: 'null'
          description: Workflow metadata. For the AI-detection workflow this is the detector's own detail, typed as `VoiceDetectionDetails`; other workflows carry their own keys here.
      required:
      - isSuccessful
      - workflowType
      - processingTimeMs
      - creditsUsed
    VoiceDetectionDetails:
      type: object
      additionalProperties: true
      description: 'Detection detail for the AI-voice workflow, keyed exactly as the detector reports it (snake_case). Every field is optional: which ones appear depends on the detector the platform runs for your account, and the set can grow without notice. Unknown keys are preserved. Other workflows (transcription, intelligence) carry their own keys here instead.'
      properties:
        provider:
          type: string
          description: Identifier of the detector that produced this verdict, e.g. `raid_1b`. The platform selects the detector per account; this is an open set — do not hard-code it. Absent on the legacy detector.
        detection_method:
          type: string
          description: How the file verdict was aggregated from per-window scores (detector-specific label).
        model_version:
          type: string
          description: Detector checkpoint identifier, for reproducibility.
        calibration_version:
          type: string
          description: Identifier of the calibration the thresholds came from.
        threshold_name:
          type: string
          description: Name of the operating point the verdict was decided against.
        response_type:
          type: string
          description: Which wire contract the detector response was parsed as.
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 'Percentile of this clip against the detector''s own reference of genuine speech, with `score_basis` saying how it was derived. 0 = indistinguishable from genuine audio, 1 = more suspicious than all of it. This is the figure to show users and to threshold on: it carries no assumption about how common fakes are, and it means the same thing across detectors. Absent means unknown, never 0.'
        score_basis:
          type: string
          description: How `score` was derived, e.g. `percentile_vs_genuine`. Only read `score` as a percentile when this says so.
        p_fake:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 'The detector''s raw fakeness output. While `probability_calibrated` is false this is a monotone ranking, not a probability: a genuine clip can report 0.0009 here and still be near the decision boundary, because the boundary is not at 0.5. Do not display it as a percentage likelihood.'
        probability_calibrated:
          type: boolean
          description: True only when `p_fake` is a calibrated posterior probability. False on current detectors.
        threshold_calibrated:
          type: boolean
          description: True when the decision threshold was fitted on a reference set rather than left at a default.
        threshold_global_tau:
          type: number
          format: double
          description: The log-likelihood-ratio cut the file-level decision was made against.
        global_llr_mean:
          type: number
          format: double
          description: Mean log-likelihood ratio over the scored windows; positive leans genuine. `global_llr_mean - threshold_global_tau` is the decision margin.
        threshold_partial_tau:
          type: number
          format: double
          description: Cut for the partial (worst-windows) rule, when the detector evaluates one.
        partial_llr_k_lowest_mean:
          type: number
          format: double
          description: Mean LLR of the `partial_k` most fake-leaning windows, measured against `threshold_partial_tau`.
        partial_k:
          type: integer
          description: How many windows the partial statistic was drawn over.
        threshold_fired_global:
          type: boolean
          description: Whether the global rule tripped. Absent means that rule was not evaluated, not that it passed.
        threshold_fired_partial:
          type: boolean
          description: Whether the partial rule tripped. The verdict is fake if either rule fires. Absent means not evaluated.
        overall_result:
          type: string
          description: File-level label as the detector stated it (`real` or `fake`).
        total_chunks:
          type: integer
          description: Windows the audio was split into.
        real_chunks:
          type: integer
          description: Scored windows labelled genuine. Window tallies do not decide the file verdict; the aggregate LLR does.
        fake_chunks:
          type: integer
          description: Scored windows labelled fake.
        n_chunks_scored:
          type: integer
          description: Windows that contributed to the aggregate.
        n_chunks_excluded:
          type: integer
          description: Windows scored but excluded from the aggregate (non-speech).
        chunks_omitted:
          type: boolean
          description: True when the per-window timeline was suppressed for this account, so an empty `chunks` is not "nothing analysed".
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/VoiceDetectionChunk'
          description: Per-window timeline, in order. May be empty or absent.
        average_confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Legacy field. Mean window fakeness, kept for compatibility; prefer `score`.
        max_confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Highest per-window confidence in that window's own verdict.
        min_confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Lowest per-window confidence in that window's own verdict.
        low_confidence:
          type: boolean
          description: The clip was too short for the verdict to rest on much audio (it was tiled to fill one window). Surface this next to the verdict.
        truncated:
          type: boolean
          description: The file exceeded the analysis ceiling and its tail was never scored; the verdict describes the analysed part only.
        truncated_s:
          type: number
          format: double
          description: Seconds that were not analysed because of truncation. Present only when something was cut.
        repeat_tiled:
          type: boolean
          description: True when the audio was repeated to fill the analysis window.
        variable_length:
          type: boolean
          description: True when the detector scored the clip in a single variable-length pass instead of fixed windows.
        audio_total_s:
          type: number
          format: double
          description: Duration of the submitted audio, in seconds.
        audio_analyzed_s:
          type: number
          format: double
          description: Seconds of audio the detector analysed.
        total_s:
          type: number
          format: double
          description: Duration of the source file in seconds (companion to `coverage_pct`).
        analyzed_s:
          type: number
          format: double
          description: Seconds actually analysed (companion to `coverage_pct`).
        coverage_s:
          type: number
          format: double
          description: Seconds of audio that fell inside some scored window.
        coverage_pct:
          type: number
          format: double
          description: Share of the whole file that was covered by scored windows, as a percentage.
        coverage_of_analyzed_pct:
          type: number
          format: double
          description: Share of the analysed span that was covered by scored windows, as a percentage.
        window_s:
          type: number
          format: double
          description: Window length in seconds.
        hop_s:
          type: number
          format: double
          description: Hop between consecutive windows in seconds.
        mode:
          type: string
          description: Sampling mode the detector ran (e.g. `sliding`, `random_k`, `full`).
        inference_s:
          type: number
          format: double
          description: Model inference time in seconds.
        timestamp_offset_s:
          type: number
          format: double
          description: Present when leading silence was trimmed; add it to window timestamps to map them back onto the original file.
        warnings:
          type: array
          items:
            type: string
          description: Run-specific caveats the detector raised. Absent when there are none.
        mode_notes:
          type: array
          items:
            type: string
          description: Human-readable notes about how this run was sampled.
        file_name:
          type: string
          description: The file name as received.
        error_code:
          type: string
          description: Machine-readable reason when `isSuccessful` is false (e.g. no clear speech). Open set.
    VoiceDetectionChunk:
      type: object
      additionalProperties: true
      description: One analysis window of the audio timeline.
      properties:
        index:
          type: integer
          description: Zero-based position in the timeline.
        chunk:
          type: string
          description: Human-readable time range label, e.g. `0-4s`.
        result:
          type: string
          description: Window label as decided by the detector (`real` or `fake`).
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Confidence in this window's own label, measured as distance past the decision boundary (same semantics as `detectionConfidence`).
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: This window's raw fakeness (`p_fake`), uncalibrated. Not a probability.
        start_s:
          type: number
          format: double
          description: Window start in seconds.
        end_s:
          type: number
          format: double
          description: Window end in seconds.
        llr:
          type: number
          format: double
          description: Window log-likelihood ratio; positive leans genuine. Absent when the detector did not report one.
        speech_ratio:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Fraction of the window that contained speech.
        quality_label:
          type: string
          description: Detector's quality label for the window.
        excluded:
          type: boolean
          description: True when this window was scored but left out of the file-level aggregate.
