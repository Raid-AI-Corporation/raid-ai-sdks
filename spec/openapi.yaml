                  - index: 1
                    chunk: 2-6s
                    result: fake
                    confidence: 0.95
                    score: 0.33
                    start_s: 2
                    end_s: 6
                    llr: -8.1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/voice-analysis/process-from-url:
    post:
      tags:
      - Audio
      operationId: voiceAnalysisProcessFromUrl
      summary: Analyze audio from a URL
      description: Analyze audio fetched from a public URL — a direct audio link, or a video or social page whose audio track is extracted automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS URL of the audio, or of a page/video whose audio is extracted.
                workflowType:
                  $ref: '#/components/schemas/VoiceWorkflowType'
                textInput:
                  type: string
                contextHints:
                  type: string
              required:
              - url
      responses:
        '200':
          description: Analysis complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceAnalysisResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/voice-analysis/credit-info:
    get:
      tags:
      - Audio
      operationId: voiceAnalysisCreditInfo
      summary: Get audio credits and limits
      description: 'Read the credit balance and the current audio limits: what each workflow costs, which ones the balance currently covers, max file size, allowed formats and the batch limit. Any valid API key may call this; no scope is required.'
      responses:
        '200':
          description: Balance and limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceAnalysisCreditInfo'
              example:
                tenantCredits: 480
                transcriptionCostPerCall: 1
                intelligenceCostPerCall: 2
                combinedCost: 3
                aiDetectionCostPerCall: 1
                canUseTranscription: true
                canUseIntelligence: true
                canUseCombined: true
                canUseAiDetection: true
                maxFileSizeMB: 50
                allowedFileFormats: wav,mp3,flac,m4a,opus
                canUseBatchUpload: true
                maxBatchSize: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/video-forensics/submit:
    post:
      tags:
      - Video
      operationId: videoForensicsSubmit
      summary: Submit a video for analysis
      description: Submit a video for deepfake and AI-generation analysis. Returns a jobId immediately; poll the job until its status is Completed. Max 100 MB per file; formats mp4, mov, avi, mkv, webm.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The video file to analyze.
                clientDurationSeconds:
                  type: number
                  format: double
                  description: Video duration in seconds (read from the file by your client). Recommended so credits are reserved accurately.
                sourceUrl:
                  type: string
                  description: Optional source URL of the video, for your own auditing.
              required:
              - file
      responses:
        '200':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoSubmitResponse'
              example:
                jobId: 9a8b7c6d-1234-5678-90ab-cdef12345678
                creditsReserved: 24
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/video-forensics/submit-from-url:
    post:
      tags:
      - Video
      operationId: videoForensicsSubmitFromUrl
      summary: Submit a video from a URL
      description: Submit a video fetched from a public URL — a direct video link or a supported hosting page. Returns a jobId to poll.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS URL of the video or hosting page.
                clientDurationSeconds:
                  type: number
                  format: double
                  description: Optional client-probed duration in seconds.
              required:
              - url
      responses:
        '200':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoSubmitResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/video-forensics/jobs/{id}:
    get:
      tags:
      - Video
      operationId: videoForensicsGetJob
      summary: Get a video analysis job
      description: Poll the status and, once complete, the result of a submitted video job.
      parameters:
      - name: id
        in: path
        required: true
        description: The `jobId` returned by submit.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The current job state. `result` is populated only when `status` is `Completed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
              example:
                id: 9a8b7c6d-1234-5678-90ab-cdef12345678
                fileName: clip.mp4
                fileSizeBytes: 18452310
                durationSeconds: 42.5
                status: Completed
                progress: 100
                statusMessage: null
                creditsReserved: 24
                creditsUsed: 24
                framesAnalyzed: 128
                processingTimeMs: 38120
                errorMessage: null
                createdAt: '2026-06-07T12:30:00Z'
                modifiedAt: '2026-06-07T12:30:39Z'
                result:
                  verdict: ai_generated
                  confidence: 0.88
                  isAiGenerated: true
                  framesAnalyzed: 128
                  durationSeconds: 42.5
                  summary: Multiple frames show generative-model artifacts consistent with AI synthesis.
                  hasDetailedReport: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/app/video-forensics/credit-info:
    get:
      tags:
      - Video
      operationId: videoForensicsCreditInfo
      summary: Get video credits and limits
      description: 'Read the credit balance and the current video limits: cost per frame, frames analyzed per second, the longest video the plan allows and what it costs, max file size, allowed formats, and today''s usage against the daily cap. Any valid API key may call this; no scope is required.'
      responses:
        '200':
          description: Balance and limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoForensicsCreditInfo'
              example:
                currentBalance: 480
                creditCostPerFrame: 1
                maxVideoLengthSeconds: 300
                maxCreditsPerVideoDerived: 300
                framesPerSecondToAnalyze: 1
                maxFileSizeMB: 100
                allowedFileFormats: mp4,mov,avi,mkv,webm
                maxVideosPerDay: 20
                videosUsedToday: 3
                canUseFeature: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/document-analysis/analyze:
    post:
      tags:
      - Document
      operationId: documentAnalysisAnalyze
      summary: Analyze a document
      description: 'Upload a PDF or an image and get back one unified analysis: a document-level forensics verdict plus per-page tampering and AI-generation results, reconciled into a single headline verdict. A full analysis runs for minutes, so this endpoint submits the job, holds the request briefly, then returns 202 with the record as it stands — 202 is the expected outcome, not an error. Poll the analysis by id until its status is completed or failed. Accepted formats are PDF, PNG, JPEG and WebP; requires an API key with the document-image scope. The Document analysis guide walks through the polling loop and how to read the result.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The document to analyze — a PDF, PNG, JPEG or WebP file.
                docType:
                  $ref: '#/components/schemas/DocumentType'
              required:
              - file
      responses:
        '200':
          description: 'The analysis reached a terminal state inside the wait budget — `status` is `completed` (or `failed` when no verdict could be produced). Uncommon: most documents take longer than the budget and land on the `202` path.'
