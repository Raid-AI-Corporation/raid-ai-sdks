        creditCostPerImage:
          type: integer
          description: Credits charged per image on the realtime tier.
        canUseFeature:
          type: boolean
          description: True when image forensics is enabled for the account AND the balance covers one image.
        maxFileSizeMB:
          type: integer
          description: Maximum size of a single image, in MB.
        allowedFileFormats:
          type: string
          description: Comma-separated list of accepted file extensions.
        canUseBatch:
          type: boolean
          description: True when the batch tier is available. Independent of canUseFeature — realtime analysis can be enabled while batch is not.
        batchCreditCostPerImage:
          type: integer
          description: Credits charged per image on the batch tier. Compare with creditCostPerImage to show the saving.
        batchMaxSize:
          type: integer
          description: Maximum images accepted in one batch submission.
      required:
      - currentBalance
      - creditCostPerImage
      - canUseFeature
      - maxFileSizeMB
      - allowedFileFormats
    VoiceAnalysisCreditInfo:
      type: object
