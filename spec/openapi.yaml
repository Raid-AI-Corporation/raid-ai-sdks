      - canUseFeature
    DocumentType:
      type: string
      description: 'Optional hint for the kind of document being submitted. When omitted — or when the value is

        not one of these — the pipeline classifies the document itself.

        - `bank_statement` — a bank account statement

        - `salary_cert` — a salary certificate

        - `invoice_po` — an invoice or purchase order

        - `kyc_id` — a KYC identity document

        - `financials` — company financial statements

        - `plane_ticket` — an airline ticket or itinerary

        '
      enum:
      - bank_statement
      - salary_cert
      - invoice_po
      - kyc_id
      - financials
      - plane_ticket
    DocumentStatus:
      type: string
      description: 'Lifecycle status — of the analysis as a whole, and of each of its two branches.

        - `processing` — accepted and still running

        - `completed` — finished

        - `failed` — could not be completed

        '
      enum:
      - processing
      - completed
      - failed
    DocumentMediaKind:
      type: string
      description: 'What the uploaded bytes actually are, derived server-side from the file''s signature rather

        than its name or declared content type.

        - `pdf` — a PDF document

        - `image` — a single document-page image

        '
      enum:
      - pdf
      - image
    DocumentFusedVerdict:
      type: string
      description: 'The headline decision for the whole document — the one field to branch on.

        - `accept` — no evidence of tampering or AI generation

        - `review` — signals worth a human look

        - `reject` — strong evidence the document is not genuine

        - `insufficient_quality` — the document could not be assessed

        '
      enum:
      - accept
      - review
      - reject
      - insufficient_quality
    DocumentRefundReason:
      type: string
      description: 'Why the credit for this analysis was returned. Present only on a refunded analysis, where

        `creditsUsed` is `0`.

        - `no_usable_output` — neither branch produced a usable result

        - `stale_timeout` — the analysis stalled and was timed out

        - `submission_failed` — it never started

        '
      enum:
      - no_usable_output
      - stale_timeout
      - submission_failed
    DocumentPageVerdict:
      type: string
      description: 'A single page''s headline. Deliberately a different vocabulary from the document-level

        `fusedVerdict` — this describes one page, not the decision about the document.

        - `authentic` — no localized edits and no sign of AI generation

        - `edited` — localized editing was found on the page

        - `ai_generated` — the page itself appears to be AI-generated

        '
      enum:
      - authentic
      - edited
      - ai_generated
    DocumentPageAiStatus:
      type: string
      description: 'Outcome of the page''s AI-generation check. It is additive — it never fails the page, so a

        non-`completed` status is normal and the page verdict still stands.

        - `not_run` — the check did not run

        - `skipped_edited` — skipped because the page was already found to be edited

        - `completed` — a verdict was produced (`aiVerdict`)

        - `failed` — the check could not complete; see `errorCode`

        '
      enum:
      - not_run
      - skipped_edited
      - completed
      - failed
    DocumentPageAiVerdict:
      type: string
      description: 'The AI-generation check''s verdict for a page. Only `ai_generated` escalates a page''s

        headline `verdict`.

        - `real` — no sign of AI generation

        - `ai_generated` — the page appears wholly AI-generated

        - `ai_edited` — AI-assisted editing

        - `digitally_edited` — conventional digital editing

        '
      enum:
      - real
      - ai_generated
      - ai_edited
      - digitally_edited
    DocumentFinding:
      type: object
      description: A single detector signal within a feature lane.
      properties:
        type:
          type: string
          description: The kind of signal, e.g. `iban_invalid_checksum`, `arithmetic_mismatch`, `xray_scanned_redaction`.
        expected:
          type:
          - string
          - 'null'
          description: The expected value, when the finding is a mismatch.
        got:
          type:
          - string
          - 'null'
          description: The observed value, when the finding is a mismatch.
        bbox:
          type:
          - array
          - 'null'
          description: NORMALIZED page box `[x0, y0, x1, y1]`, each value 0–1. A different coordinate space from `DocumentAnalysisPage.editedRegions`, which is in original-image pixels — divide those by the page dimensions to draw both on one overlay.
          items:
            type: number
            format: double
        page:
          type:
          - integer
          - 'null'
          description: 1-based page number the finding is on.
        confidence:
          type:
          - number
          - 'null'
          format: float
          minimum: 0
          maximum: 1
        note:
          type:
          - string
          - 'null'
          description: Free-text note; may carry recovered hidden content as `hidden:'…'`.
      required:
      - type
    DocumentFeatureScore:
      type: object
      description: One feature lane of the forensics verdict (tampering / consistency / anomaly).
      properties:
        score:
          type: number
          format: float
          description: Raw lane score (0–1).
        calibratedProbability:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Calibrated probability for this lane (0–1).
        reliability:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: How reliable this lane's signal is for this document (0–1). Below ~0.7, treat it as low-confidence.
        softScoreCalibrated:
          type: boolean
          description: Whether the lane's score is calibrated.
        findings:
          type: array
          description: The individual detector signals behind the lane score.
          items:
            $ref: '#/components/schemas/DocumentFinding'
        evidenceUris:
          type: array
          description: Storage URIs of this lane's evidence rasters. Not publicly fetchable — read a crop through `GET /api/app/document-analysis/{id}/evidence` instead.
          items:
            type: string
      required:
      - score
      - calibratedProbability
      - reliability
      - findings
      - evidenceUris
    DocumentVerdict:
      type: object
      description: The document-level forensics verdict — three feature lanes plus their own fused conclusion.
      properties:
        docId:
          type: string
        docType:
          type: string
        docTypeConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        tampering:
          oneOf:
          - $ref: '#/components/schemas/DocumentFeatureScore'
          - type: 'null'
          description: Tampering lane — overlays, painted-over regions, bad redactions, font substitution.
        consistency:
          oneOf:
          - $ref: '#/components/schemas/DocumentFeatureScore'
          - type: 'null'
          description: Consistency lane — arithmetic, IBAN checksums, dates, cross-field agreement.
        anomaly:
          oneOf:
          - $ref: '#/components/schemas/DocumentFeatureScore'
          - type: 'null'
          description: Anomaly lane — how far the document sits from others of its type.
        fusedVerdict:
          $ref: '#/components/schemas/DocumentFusedVerdict'
        fusedProbability:
          type: number
          format: float
          minimum: 0
          maximum: 1
        fusionRationale:
          type: string
          description: Explanation of this branch's verdict; may name the rule types that fired.
        pipelineVersions:
          type: object
          additionalProperties:
            type: string
          description: Map of pipeline component → version, for reproducibility.
        processedAt:
          type: string
          format: date-time
        latencyMs:
          type: integer
          description: This branch's latency in milliseconds.
      required:
      - docId
      - fusedVerdict
      - fusedProbability
    DocumentAnalysisRegion:
      type: object
      description: One localized edited region on a page, in ORIGINAL-IMAGE PIXELS with a top-left origin, against the page's `pageWidth` / `pageHeight` — safe to draw directly on the raster served by `GET /api/app/document-analysis/{id}/pages/{pageNumber}/image`. Note this is NOT the normalized 0–1 space that `DocumentFinding.bbox` uses.
      properties:
        x:
          type: number
          format: double
          description: Left edge, in original-image pixels.
        y:
          type: number
          format: double
          description: Top edge, in original-image pixels.
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        score:
          type: number
          format: double
          description: Max anomaly probability inside the region (0–1) — the number to badge the box with.
        meanScore:
          type: number
          format: double
          description: Mean anomaly probability inside the region (0–1).
        areaFraction:
          type: number
          format: double
          description: Region area ÷ image area.
      required:
      - x
      - y
      - width
      - height
      - score
      - meanScore
      - areaFraction
    DocumentAnalysisPage:
      type: object
      description: One page's two legs — localized editing detection, then (on a clean page) the AI-generation check. Pages appear as they finish, so this list grows while the analysis runs.
      properties:
        pageNumber:
          type: integer
          description: 1-based page number.
        verdict:
          oneOf:
          - $ref: '#/components/schemas/DocumentPageVerdict'
          - type: 'null'
          description: 'The page''s headline. **Render this, not `localizedEditing`** — a wholly AI-generated page carries `localizedEditing: false`, because no region of it was edited. Null when the page has no localization result at all.'
        localizedEditing:
          type:
          - boolean
          - 'null'
          description: The localization check's editing call — whether its whole-page score crossed `threshold`. Null when that leg failed.
        editingScore:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 1
          description: Whole-page editing score (0–1); higher = more likely edited.
        aiStatus:
          $ref: '#/components/schemas/DocumentPageAiStatus'
        aiVerdict:
          oneOf:
          - $ref: '#/components/schemas/DocumentPageAiVerdict'
          - type: 'null'
          description: Present only when `aiStatus` is `completed`.
        aiConfidence:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 1
          description: Confidence in `aiVerdict` — **not** a probability that the page is AI-generated. Only meaningful read together with the verdict it belongs to.
        errorCode:
          type:
          - string
          - 'null'
          description: Stable error code when one of the page's legs failed. Null otherwise.
        completedAt:
          type: string
          format: date-time
        editedRegions:
          type: array
          description: Localized edited regions, strongest first (max 10). Empty when the page is clean or the localization leg failed.
          items:
            $ref: '#/components/schemas/DocumentAnalysisRegion'
        pageWidth:
          type:
          - integer
          - 'null'
          description: Pixel width of the raster the regions are expressed against — and of the exact raster the page-image endpoint serves, so boxes cannot drift from the image they are drawn on.
        pageHeight:
          type:
          - integer
          - 'null'
          description: Pixel height counterpart of `pageWidth`.
        meanConfidence:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 1
          description: The localization check's self-estimated reliability of its map (0–1). Below ~0.7, present the regions as approximate.
        threshold:
          type:
          - number
          - 'null'
          format: double
          description: Decision threshold the localization check ran with — context for `editingScore`.
        hasImage:
          type: boolean
          description: True when a stored page raster exists and `GET /api/app/document-analysis/{id}/pages/{pageNumber}/image` will serve it.
      required:
      - pageNumber
      - aiStatus
      - completedAt
      - editedRegions
      - hasImage
    DocumentAnalysis:
      type: object
      description: 'One unified document analysis — the same shape whether the job is still running (`202`) or

        terminal (`200`), so a client renders partial and final results with one code path.


        Two verdicts, two vocabularies: the document-level `fusedVerdict`

        (`accept`/`review`/`reject`/`insufficient_quality`) is the overall decision, while a page''s

        `verdict` (`authentic`/`edited`/`ai_generated`) describes that one page.

        '
      properties:
        id:
          type: string
          format: uuid
          description: Analysis id — use it for `GET {id}` and the page-image / evidence endpoints.
        docId:
          type: string
          description: Pipeline document identifier (tenant-encoded).
        fileName:
          type:
          - string
          - 'null'
          description: Original uploaded file name.
        mediaKind:
          $ref: '#/components/schemas/DocumentMediaKind'
        docType:
          type: string
          description: The classified (or supplied) document type — see `DocumentType` for the common values. Empty until classified, and empty when it could not be determined.
        status:
          $ref: '#/components/schemas/DocumentStatus'
        forensicsStatus:
          $ref: '#/components/schemas/DocumentStatus'
        pagesStatus:
          $ref: '#/components/schemas/DocumentStatus'
        fusedVerdict:
          type: string
          description: The headline verdict once complete — see `DocumentFusedVerdict` for the values. Empty while processing.
        fusedProbability:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Risk score (0–1) behind `fusedVerdict`. It is the strongest signal that fired, never a blend of the branches.
        fusionRationale:
          type: string
          description: Plain-language explanation of the verdict. Empty while processing.
        stageErrorsJson:
          type:
          - string
          - 'null'
          description: Stage failures as a JSON-array-encoded **string**, e.g. `"[\"forensics_timeout\"]"` — parse it as JSON, and treat an unparseable value as a single unstructured error. Null when nothing failed.
        pagesTotal:
          type: integer
          description: Total pages in the document.
        pagesCompleted:
          type: integer
          description: Pages finished so far.
        pagesFailed:
          type: integer
          description: Pages that errored.
        creditsUsed:
          type: integer
          description: Credits charged for this analysis; `0` when the credit was refunded.
        refundReason:
          oneOf:
          - $ref: '#/components/schemas/DocumentRefundReason'
          - type: 'null'
          description: Present when the credit was returned.
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the analysis became terminal. Null while processing.
        docTypeConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence in `docType` (0–1); `0` when unknown.
        processingTimeMs:
          type: integer
          format: int64
          description: Forensics-branch wall-clock in milliseconds; `0` when unknown.
        processedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the forensics branch produced its verdict. Null when unknown.
        hasOriginal:
          type: boolean
          description: True while a retained copy of the uploaded document exists for this analysis.
        verdict:
          oneOf:
          - $ref: '#/components/schemas/DocumentVerdict'
          - type: 'null'
          description: The full forensics verdict — feature lanes and findings. Null while that branch is still running, or if it never reported.
        pages:
          type: array
          description: Per-page results; grows while the analysis runs.
          items:
            $ref: '#/components/schemas/DocumentAnalysisPage'
      required:
      - id
      - docId
      - mediaKind
      - docType
      - status
      - forensicsStatus
      - pagesStatus
      - fusedVerdict
      - fusedProbability
      - fusionRationale
      - pagesTotal
      - pagesCompleted
      - pagesFailed
      - creditsUsed
      - pages
    DocumentAnalysisCreditInfo:
      type: object
      description: Credit balance and the live upload constraints for document analysis.
      properties:
        currentBalance:
          type: integer
          description: Credits available on the account.
        creditCostPerDocument:
          type: integer
          description: Credits charged per analysis.
        maxBatchFiles:
          type: integer
          description: Maximum documents to submit in one batch (default 5).
        analyzeConcurrency:
          type: integer
          description: Recommended number of concurrent `analyze` requests when working through a batch (default 3).
        maxFileSizeMB:
          type: integer
          description: Maximum PDF size in MB (default 25).
        maxImageSizeMB:
          type: integer
          description: Maximum image size in MB (default 10).
        userHeadroomRemaining:
          type:
          - integer
          - 'null'
          description: Credits left under the calling user's own cap. Null for a principal without one — an API token has no per-user cap, so it is always null for token callers.
        canUseFeature:
          type: boolean
          description: True when document analysis is enabled for the account AND the balance covers one document.
      required:
      - currentBalance
      - creditCostPerDocument
      - maxBatchFiles
      - analyzeConcurrency
      - maxFileSizeMB
      - maxImageSizeMB
      - canUseFeature
    DocumentError:
      type: object
      description: The error shape the document-analysis endpoints return for a rejected upload — a single human-readable message, without the `{ code, message }` envelope the other modalities use.
      properties:
        error:
          type: string
          description: What went wrong, in plain language.
      required:
      - error
    PaywallError:
      type: object
      description: Returned when a per-user credit cap has been reached.
      properties:
        code:
          type: string
          description: '`USER_CREDIT_LIMIT_REACHED`'
        feature:
          type: string
          description: The feature the cap applies to, e.g. `document-analysis`.
        redirectUrl:
          type:
          - string
          - 'null'
        message:
          type: string
      required:
      - code
      - feature
      - message
